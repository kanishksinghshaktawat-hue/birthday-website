<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth}

body{
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#fff8fb,#ffe6f0);
color:#444;
overflow-x:hidden;
}

.container{
max-width:760px;
margin:auto;
padding:30px 16px 50px;
position:relative;
z-index:2;
}

.hero{
text-align:center;
padding:30px 5px;
}

.kicker{
letter-spacing:5px;
color:#999;
font-size:13px;
margin-bottom:18px;
text-transform:uppercase;
}

h1{
font-size:clamp(42px,11vw,76px);
color:#df1764;
line-height:1;
}

.hero-name{
font-size:28px;
margin:15px 0 28px;
}

.photo-wrap{
width:min(290px,76vw);
height:min(290px,76vw);
margin:auto;
position:relative;
}

.photo-wrap:before{
content:"";
position:absolute;
inset:-12px;
border:2px dashed #f28ab2;
border-radius:50%;
animation:spin 18s linear infinite;
}

.photo-wrap:after{
content:"";
position:absolute;
inset:-4px;
border:8px solid white;
border-radius:50%;
box-shadow:0 15px 35px #c46b8840;
}

.main-photo{
width:100%;
height:100%;
object-fit:cover;
border-radius:50%;
position:relative;
z-index:1;
}

@keyframes spin{
to{transform:rotate(360deg)}
}

.btn{
border:0;
background:linear-gradient(135deg,#ed1768,#f65b99);
color:white;
padding:16px 30px;
border-radius:40px;
font-size:18px;
font-weight:bold;
box-shadow:0 14px 30px #ed176844;
cursor:pointer;
}

.start{
margin-top:28px;
}

.card{
background:#fffffff2;
border-radius:30px;
padding:27px 18px;
margin:22px 0;
box-shadow:0 15px 45px #9d446814;
position:relative;
overflow:hidden;
}

.card h2{
text-align:center;
color:#df1764;
font-size:29px;
margin-bottom:22px;
}

.countdown{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:9px;
}

.time{
background:linear-gradient(135deg,#ed1768,#f45a98);
color:white;
border-radius:19px;
padding:17px 4px;
text-align:center;
}

.time b{
font-size:30px;
display:block;
}

.time span{
font-size:11px;
letter-spacing:1px;
}

.message{
text-align:center;
font-size:19px;
line-height:1.75;
}

.gallery{
display:grid;
grid-template-columns:1fr 1fr;
gap:13px;
}

.gallery img{
width:100%;
aspect-ratio:1;
object-fit:cover;
border-radius:22px;
box-shadow:0 8px 22px #00000014;
animation:photoIn .8s ease both;
}

.gallery img:nth-child(2){animation-delay:.15s}
.gallery img:nth-child(3){animation-delay:.3s}
.gallery img:nth-child(4){animation-delay:.45s}

@keyframes photoIn{
from{opacity:0;transform:scale(.9)}
to{opacity:1;transform:scale(1)}
}

.music{
position:fixed;
right:17px;
top:17px;
z-index:30;
width:55px;
height:55px;
border:0;
border-radius:50%;
background:white;
box-shadow:0 10px 30px #0002;
font-size:23px;
}

.heart{
position:fixed;
bottom:-30px;
z-index:10;
pointer-events:none;
animation:floatUp linear forwards;
}

@keyframes floatUp{
0%{
transform:translateY(0) rotate(0);
opacity:0;
}
10%{opacity:.9}
100%{
transform:translateY(-115vh) rotate(30deg);
opacity:0;
}
}

.modal{
position:fixed;
inset:0;
background:#230a16b8;
backdrop-filter:blur(8px);
z-index:100;
display:none;
align-items:center;
justify-content:center;
padding:20px;
}

.modal.show{
display:flex;
}

.modal-box{
width:min(500px,100%);
background:white;
border-radius:32px;
padding:38px 25px;
text-align:center;
animation:pop .5s ease;
}

@keyframes pop{
from{
transform:scale(.5);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

.gift{
font-size:75px;
animation:bounce 1s infinite alternate;
}

@keyframes bounce{
to{
transform:translateY(-10px) rotate(5deg);
}
}

.modal h3{
font-size:32px;
color:#df1764;
margin:15px 0;
}

.modal p{
font-size:18px;
line-height:1.7;
color:#666;
margin-bottom:22px;
}

.footer{
text-align:center;
color:#999;
font-size:14px;
padding:10px;
}

@media(max-width:480px){

.container{
padding-left:13px;
padding-right:13px;
}

.card{
padding:24px 14px;
}

.countdown{
gap:6px;
}

.time{
padding:15px 3px;
}

.time b{
font-size:25px;
}

.time span{
font-size:10px;
}

.message{
font-size:17px;
}

.gallery{
gap:10px;
}

}
</style>
</head>

<body>

<!-- =================================================
CUSTOMER DETAILS
ONLY CHANGE THESE DETAILS FOR EVERY CUSTOMER
================================================= -->

<script>

const birthdayData = {

name: "Ananya",

birthday: "2026-10-05T00:00:00",

mainPhoto:
"https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=900",

message:
"Happy Birthday Ananya! ❤️ May your special day be filled with happiness, laughter and beautiful memories. You are truly special, and I hope this year brings you everything you wish for. Keep smiling and keep shining! ✨",

song:
"https://cdn.pixabay.com/audio/2022/10/25/audio_946e5b5f4f.mp3",

photos: [

"https://images.unsplash.com/photo-1517841905240-472988babdf9?w=900",

"https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=900",

"https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=900",

"https://images.unsplash.com/photo-1508214751196-bcfd4ca60f91?w=900"

]

};

</script>


<button class="music" id="musicBtn">🔇</button>

<audio id="music" loop></audio>


<div class="container">

<section class="hero">

<div class="kicker">
A Special Day For
</div>

<h1>
Happy Birthday 🎂
</h1>

<div class="hero-name" id="heroName"></div>

<div class="photo-wrap">

<img
id="mainPhoto"
class="main-photo"
alt="Birthday Photo">

</div>

<button class="btn start" id="startBtn">
✨ Start The Surprise
</button>

</section>


<section class="card">

<h2>
🎉 Birthday Countdown
</h2>

<div class="countdown">

<div class="time">
<b id="days">00</b>
<span>DAYS</span>
</div>

<div class="time">
<b id="hours">00</b>
<span>HOURS</span>
</div>

<div class="time">
<b id="minutes">00</b>
<span>MINUTES</span>
</div>

<div class="time">
<b id="seconds">00</b>
<span>SECONDS</span>
</div>

</div>

</section>


<section class="card">

<h2>
💌 A Message For You
</h2>

<p
class="message"
id="message">
</p>

</section>


<section class="card">

<h2>
🎁 One Little Surprise
</h2>

<p
class="message"
style="margin-bottom:22px">

Someone has prepared something special for you...

</p>

<div style="text-align:center">

<button
class="btn"
id="surpriseBtn">

Open Your Surprise 💝

</button>

</div>

</section>


<section class="card">

<h2>
📸 Beautiful Memories
</h2>

<div
class="gallery"
id="gallery">
</div>

</section>


<div class="footer">
Made with ❤️ specially for you
</div>

</div>


<div
class="modal"
id="modal">

<div class="modal-box">

<div class="gift">
🎁
</div>

<h3>
Surprise! 💖
</h3>

<p id="surpriseText"></p>

<button
class="btn"
id="closeBtn">

Close ❤️

</button>

</div>

</div>


<script>

/* BASIC DETAILS */

document.getElementById("heroName").textContent =
birthdayData.name + " ❤️";

document.getElementById("mainPhoto").src =
birthdayData.mainPhoto;

document.getElementById("message").textContent =
birthdayData.message;

document.getElementById("music").src =
birthdayData.song;


/* SURPRISE MESSAGE */

document.getElementById("surpriseText").textContent =

"Today is all about you, " +
birthdayData.name +
"! 🎉 May your life always be filled with love, happiness, success and beautiful moments. Keep smiling! ❤️";


/* PHOTOS */

const gallery =
document.getElementById("gallery");

birthdayData.photos.forEach((photo,index)=>{

const img =
document.createElement("img");

img.src = photo;

img.alt =
"Beautiful Memory " + (index+1);

img.loading = "lazy";

gallery.appendChild(img);

});


/* COUNTDOWN */

const target =
new Date(birthdayData.birthday).getTime();

function updateCountdown(){

let difference =
target - Date.now();

if(difference < 0)
difference = 0;

const days =
Math.floor(difference / 86400000);

const hours =
Math.floor(
(difference % 86400000) / 3600000
);

const minutes =
Math.floor(
(difference % 3600000) / 60000
);

const seconds =
Math.floor(
(difference % 60000) / 1000
);

document.getElementById("days").textContent =
String(days).padStart(2,"0");

document.getElementById("hours").textContent =
String(hours).padStart(2,"0");

document.getElementById("minutes").textContent =
String(minutes).padStart(2,"0");

document.getElementById("seconds").textContent =
String(seconds).padStart(2,"0");

}

updateCountdown();

setInterval(updateCountdown,1000);


/* FALLING HEARTS */

let heartInterval;

function createHeart(){

const heart =
document.createElement("div");

heart.className =
"heart";

const hearts =
["💗","💖","💕","💘","💝","❤️"];

heart.textContent =
hearts[
Math.floor(Math.random()*hearts.length)
];

heart.style.left =
Math.random()*100 + "vw";

heart.style.fontSize =
(16 + Math.random()*24) + "px";

heart.style.animationDuration =
(5 + Math.random()*5) + "s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},11000);

}

function startHearts(){

if(heartInterval)
return;

for(let i=0;i<15;i++){

setTimeout(
createHeart,
i*180
);

}

heartInterval =
setInterval(
createHeart,
450
);

}

startHearts();


/* MUSIC */

const music =
document.getElementById("music");

const musicBtn =
document.getElementById("musicBtn");

let playing = false;

async function toggleMusic(){

try{

if(!playing){

await music.play();

playing = true;

musicBtn.textContent =
"🔊";

}else{

music.pause();

playing = false;

musicBtn.textContent =
"🔇";

}

}catch(error){

alert(
"Music start nahi hua. Song URL check karein."
);

}

}


/* START SURPRISE */

document.getElementById("startBtn")
.addEventListener("click",()=>{

startHearts();

toggleMusic();

document.getElementById("surpriseBtn")
.scrollIntoView({
behavior:"smooth",
block:"center"
});

});


/* SURPRISE POPUP */

document.getElementById("surpriseBtn")
.addEventListener("click",()=>{

document.getElementById("modal")
.classList.add("show");

for(let i=0;i<35;i++){

setTimeout(
createHeart,
i*70
);

}

});


/* CLOSE */

document.getElementById("closeBtn")
.addEventListener("click",()=>{

document.getElementById("modal")
.classList.remove("show");

});

</script>

</body>
</html>
